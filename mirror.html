<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复古划痕特效镜子</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            /* 深色背景让复古感更强 */
            background-color: #1a1a1a; 
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace; /* 復古打字機字體 */
            margin: 0;
            overflow: hidden; /* 防止出现滚动条 */
        }

        h2 {
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 容器：用来固定镜子和特效的位置 */
        .mirror-container {
            position: relative;
            width: 640px;
            max-width: 90%;
            aspect-ratio: 4/3; /* 保持视频比例 */
            border-radius: 16px;
            /* 给镜子加一个厚重的边框，增加年代感 */
            border: 10px solid #2c3e50; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.5);
            overflow: hidden;
            background: #000;
        }

        /* 摄像头画面 */
        #mirror-video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 确保画面填满容器 */
            transform: scaleX(-1); /* 镜像翻转 */
            
            /* 关键点：在这里给视频本身加一点复古滤镜 */
            filter: brightness(0.9) contrast(1.2) saturate(0.3); 
        }

        /* 特效层（划痕与噪点） */
        .scratch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* 
               这是实现特效的核心：一张带有透明通道的划痕/噪点图片 
               为了方便演示，这里使用了一张在线的透明背景图片
               你可以替换成你自己准备的图片链接，或者本地图片路径
            */
            background-image: url('https://www.transparenttextures.com/patterns/dust.png'); /* 细微灰尘纹理 */
            
            /* 叠加第二层纹理：粗划痕 (这里找了一张透明背景的划痕图) */
            background-image: 
                url('https://www.transparenttextures.com/patterns/dust.png'),
                url('https://www.transparenttextures.com/patterns/lined-paper-2.png'); /* 模拟一些线条划痕 */
            
            /* 让纹理稍微重复平铺 */
            background-repeat: repeat;
            
            /* 混合模式：让划痕图片自然地“融合”进视频画面里 */
            mix-blend-mode: screen; 
            
            /* 调整透明度，让划痕不要太抢眼，若隐若现 */
            opacity: 0.6; 
            
            /* 这一层不阻挡鼠标事件，防止影响可能的点击交互 */
            pointer-events: none; 
        }

    </style>
</head>
<body>

    <h2>复古魔法镜</h2>
    
    <div class="mirror-container">
        <!-- 视频层 -->
        <video id="mirror-video" autoplay playsinline></video>
        <!-- 划痕特效覆盖层 -->
        <div class="scratch-overlay"></div>
    </div>
    <p style="margin-top: 10px; font-size: 0.8em; color: #888;">提示：已应用暗角、去色和划痕纹理</p>

    <script>
        const videoElement = document.getElementById('mirror-video');

        // 1. 调用摄像头
        navigator.mediaDevices.getUserMedia({ 
            video: true, 
            audio: false 
        })
        .then(function(stream) {
            videoElement.srcObject = stream;
        })
        .catch(function(error) {
            console.error("无法访问摄像头：", error);
            alert("无法打开摄像头，请检查权限！");
        });
    </script>

</body>
</html>
